include:
  - path: ./services/omai-control-plane/docker-compose.yml

services:
  omai-app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        VITE_OMAI_API_BASE_URL: ${VITE_OMAI_API_BASE_URL:-http://localhost:8787}
        VITE_OMAI_API_TOKEN: ${VITE_OMAI_API_TOKEN:-}
        VITE_OMAI_VOICE_GATEWAY_URL: ${VITE_OMAI_VOICE_GATEWAY_URL:-ws://localhost:8791}
    ports:
      - "127.0.0.1:${OMAI_FRONTEND_PORT:-4444}:80"
    depends_on:
      omai:
        condition: service_healthy
      voice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    restart: unless-stopped
