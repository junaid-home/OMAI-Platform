name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: |
            services/omai-control-plane/go.sum
            services/omai-control-plane/integration/adk/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/omai-control-plane/sdk/typescript/package-lock.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.72.0"
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix services/omai-control-plane/sdk/typescript --no-audit --no-fund
      - run: bun run verify:portal
      - run: npm --prefix services/omai-control-plane/sdk/typescript run verify
      - run: make verify
        working-directory: services/omai-control-plane
