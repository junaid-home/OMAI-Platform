syntax = "proto3";

package uab.v1;

import "uab/v1/annotations.proto";

option go_package = "github.com/omai/backend/gen/go/uab/v1;uabv1";

// The uab.v1 wire package is retained intentionally for the existing OMAI
// SolidJS client. All implementation and product naming is OMAI.
service ControlPlaneService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (uab.v1.tool) = {
      enabled: true
      public_name: "system_health"
      description: "Read OMAI control-plane health"
      risk: RISK_LEVEL_READ
      confirmation: CONFIRMATION_POLICY_NEVER
      timeout_ms: 2000
      idempotent: true
      executor: "go.control-plane"
      version: "v1"
    };
  }
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse) {
    option (uab.v1.tool) = {
      enabled: true
      public_name: "list_agent_runtimes"
      description: "List configured agent runtimes"
      risk: RISK_LEVEL_READ
      confirmation: CONFIRMATION_POLICY_NEVER
      permissions: "runtime:read"
      timeout_ms: 5000
      idempotent: true
      executor: "go.control-plane"
      version: "v1"
    };
  }
  rpc Prompt(PromptRequest) returns (PromptResponse) {
    option (uab.v1.tool) = {
      enabled: true
      public_name: "prompt_agent"
      description: "Submit a prompt to an OMAI-managed runtime"
      risk: RISK_LEVEL_WRITE
      confirmation: CONFIRMATION_POLICY_NEVER
      permissions: "agent:prompt"
      timeout_ms: 10000
      idempotent: false
      executor: "go.orchestrator"
      version: "v1"
      required_fields: "runtime_id"
      required_fields: "external_session_id"
      required_fields: "root"
      required_fields: "text"
    };
  }
  rpc Cancel(CancelRequest) returns (CancelResponse) {
    option (uab.v1.tool) = {
      enabled: true
      public_name: "cancel_agent"
      description: "Cancel an active agent turn"
      risk: RISK_LEVEL_WRITE
      confirmation: CONFIRMATION_POLICY_NEVER
      permissions: "agent:cancel"
      timeout_ms: 5000
      idempotent: true
      executor: "go.orchestrator"
      version: "v1"
      required_fields: "runtime_id"
      required_fields: "external_session_id"
    };
  }
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Event) {
    option (uab.v1.tool) = {
      enabled: true
      public_name: "subscribe_session_events"
      description: "Replay and stream normalized session events"
      risk: RISK_LEVEL_READ
      confirmation: CONFIRMATION_POLICY_NEVER
      permissions: "session:read"
      timeout_ms: 0
      idempotent: true
      executor: "go.event-store"
      version: "v1"
      required_fields: "session_id"
    };
  }
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  int64 unix_millis = 2;
  string version = 3;
}
message ListRuntimesRequest {}
message Capability {
  string name = 1;
  bool enabled = 2;
}
message RuntimeInstallation {
  string id = 1;
  string runtime = 2;
  string label = 3;
  string version = 4;
  string node_id = 5;
  string transport = 6;
  repeated Capability capabilities = 7;
  bool enabled = 8;
}
message ListRuntimesResponse {
  repeated RuntimeInstallation runtimes = 1;
}

message PromptRequest {
  string runtime_id = 1;
  string external_session_id = 2;
  string root = 3;
  string text = 4;
  string title = 5;
  // Provider and model are selected by the Portal catalog. The control plane
  // validates both values before forwarding them to an agent runtime.
  string provider_id = 6;
  string model_id = 7;
}
message PromptResponse {
  bool accepted = 1;
  string session_id = 2;
  string workspace_id = 3;
}
message CancelRequest {
  string runtime_id = 1;
  string external_session_id = 2;
}
message CancelResponse {
  bool cancelled = 1;
}

message SubscribeEventsRequest {
  string runtime_id = 1;
  string session_id = 2;
  string workspace_id = 3;
  uint64 since = 4;
}
message Event {
  uint64 seq = 1;
  int64 unix_millis = 2;
  string type = 3;
  string workspace_id = 4;
  string session_id = 5;
  string runtime_id = 6;
  string external_session_id = 7;
  bytes payload_json = 8;
}

service WorkspaceGatewayService {
  rpc Fetch(WorkspaceFetchRequest) returns (stream WorkspaceFetchChunk) {
    option (uab.v1.tool) = {
      enabled: true
      public_name: "fetch_workspace_preview"
      description: "Fetch a path from the configured preview upstream"
      risk: RISK_LEVEL_READ
      confirmation: CONFIRMATION_POLICY_NEVER
      permissions: "preview:read"
      timeout_ms: 30000
      idempotent: false
      executor: "go.preview-gateway"
      version: "v1"
      required_fields: "method"
      required_fields: "path"
    };
  }
}
message Header {
  string name = 1;
  string value = 2;
}
message WorkspaceFetchRequest {
  string method = 1;
  string path = 2;
  repeated Header headers = 3;
  bytes body = 4;
}
message WorkspaceFetchChunk {
  int32 status = 1;
  repeated Header headers = 2;
  bytes data = 3;
  bool end = 4;
  string error = 5;
}
