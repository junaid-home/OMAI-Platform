version: v2
modules:
  - path: api
lint:
  use:
    - STANDARD
  # OMAI Web already imports the established uab.v1 request/response type
  # names (for example GitStatusRequest and streaming Event responses). Keep
  # that source contract stable while enforcing every other STANDARD rule.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
