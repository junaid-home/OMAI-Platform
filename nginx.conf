map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep this aligned with the Portal and API upload limit. The previous
    # 25 MiB proxy limit rejected valid project ZIPs before they reached the
    # application, which surfaced in the UI as a misleading extraction error.
    client_max_body_size 210m;
    client_body_timeout 300s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Same-origin ConnectRPC fallback. Direct browser deployments may instead
    # set VITE_OMAI_API_BASE_URL to the public control-plane origin.
    location ~ ^/(uab\.v1\.|omai\.platform\.v1\.|grpc\.health\.v1\.|grpc\.reflection\.v1) {
        proxy_pass http://omai:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /omai/voice/ws {
        proxy_pass http://voice:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
